<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内部物品领用统计</title>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f7f7; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h2 { margin: 0; font-size: 20px; color: #222; }
    .admin-link { color: #07c160; text-decoration: none; font-size: 14px; font-weight: bold; cursor: pointer; }
    
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; border-left: 4px solid #07c160; padding-left: 8px; }
    
    /* 提醒横幅 */
    .banner { background-color: #fffbe6; border: 1px solid #ffe58f; padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #8c6b00; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .banner-status { font-weight: bold; }
    
    .form-group { margin-bottom: 12px; }
    .input-text, .select-box { width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; outline: none; }
    .input-text:focus { border-color: #07c160; }
    
    /* 单选框样式 */
    .radio-group { display: flex; gap: 15px; margin-top: 5px; }
    .radio-label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    .goods-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .goods-item:last-child { border-bottom: none; }
    .goods-info { display: flex; flex-direction: column; }
    .goods-name { font-size: 15px; font-weight: 500; }
    .goods-stock { font-size: 12px; color: #888; margin-top: 2px; }
    
    .counter { display: flex; align-items: center; }
    .btn-counter { width: 32px; height: 32px; background-color: #f2f2f2; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn-counter:disabled { opacity: 0.5; cursor: not-allowed; }
    .count-num { width: 36px; text-align: center; font-size: 15px; font-weight: bold; }
    
    .btn-submit { width: 100%; padding: 12px; background-color: #07c160; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .record-item { background: #f9f9f9; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; color: #666; position: relative; }
    .record-item .user-info { font-weight: bold; color: #333; margin-bottom: 4px; }
    .record-item .btn-delete { position: absolute; right: 10px; top: 10px; background: #e64340; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }

    /* 看板样式 */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
    .stat-card { background: #fdfdfd; border: 1px solid #eee; border-radius: 6px; padding: 8px; text-align: center; }
    .stat-num { font-size: 18px; font-weight: bold; color: #07c160; margin-top: 4px; }

    /* 管理员控制台 */
    .admin-panel { display: none; background: #e8f4ff; border: 1px solid #b3d8ff; }
    .admin-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-admin { padding: 6px 12px; border: none; border-radius: 4px; background: #1890ff; color: #fff; cursor: pointer; font-size: 13px; }
    .btn-danger { background: #e64340; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>内部物品领用统计</h2>
    <a id="admin-toggle-btn" class="admin-link" onclick="toggleAdminMode()">管理员入口</a>
  </div>

  <!-- 顶部截止时间提醒 -->
  <div class="banner">
    <div>⏰ 报名截止时间：<span id="deadline-text">加载中...</span></div>
    <div class="banner-status" id="deadline-status"></div>
  </div>

  <!-- 管理员控制台 -->
  <div id="admin-panel" class="card admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <div class="card-title" style="margin:0;">⚙️ 管理员控制台</div>
      <button class="btn-admin btn-danger" onclick="toggleAdminMode()">退出管理</button>
    </div>

    <h4>1. 设置报名截止时间</h4>
    <div class="admin-row">
      <input type="datetime-local" id="deadline-input" class="input-text">
      <button class="btn-admin" onclick="saveDeadline()">保存截止时间</button>
    </div>

    <h4>2. 添加/修改商品及库存</h4>
    <div id="admin-goods-list"></div>
    <div class="admin-row" style="margin-top:8px;">
      <input type="text" id="new-goods-name" placeholder="新商品名称" class="input-text">
      <input type="number" id="new-goods-stock" placeholder="库存" class="input-text" style="width: 100px;">
      <button class="btn-admin" onclick="addGoods()">添加商品</button>
    </div>

    <h4>3. 数据导出与维护</h4>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn-admin" style="flex: 1; background:#028259;" onclick="exportToExcel()">📥 导出申报记录 (Excel/CSV)</button>
      <button class="btn-admin btn-danger" style="flex: 1;" onclick="clearAllRecords()">🗑️ 清空所有申报记录</button>
    </div>
  </div>

  <!-- 报名汇总看板 -->
  <div class="card">
    <div class="card-title">📊 报名汇总统计</div>
    <div class="stat-grid" id="stat-grid-box">
      <!-- 动态数据汇总 -->
    </div>
  </div>

  <!-- 个人信息 -->
  <div class="card">
    <div class="card-title">1. 填写个人信息</div>
    <div class="form-group">
      <input type="tel" id="phone" class="input-text" placeholder="请输入联系电话（自动匹配历史提交） *" onblur="handlePhoneBlur()">
    </div>
    <div class="form-group">
      <input type="text" id="username" class="input-text" placeholder="请输入姓名 *">
    </div>
    <div class="form-group">
      <input type="text" id="remark" class="input-text" placeholder="备注信息（选填）">
    </div>
    <div class="form-group" style="margin-top: 10px;">
      <label>提货地址：</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="pickupLocation" value="培训中心" checked> 培训中心</label>
        <label class="radio-label"><input type="radio" name="pickupLocation" value="第二办公区"> 第二办公区</label>
      </div>
    </div>
    <div style="margin-top: 10px;">
      <label><input type="checkbox" id="useCoupon"> 是否使用优惠券</label>
    </div>
  </div>

  <!-- 选择物品 -->
  <div class="card">
    <div class="card-title">2. 选择物品</div>
    <div id="goods-container">加载中...</div>
  </div>

  <button id="submit-btn" class="btn-submit" onclick="submitOrder()">确认提交并扣减库存</button>

  <!-- 提交记录区 -->
  <div class="card" style="margin-top: 20px;">
    <div class="card-title" id="records-title">我的提交记录</div>
    <div style="font-size:12px; color:#888; margin-bottom:8px;">请输入手机号自动查询您的历史记录</div>
    <div id="records-container"></div>
  </div>
</div>

<script>
  // 1. 请替换为你的 Supabase URL 及 Anon Key
  const SUPABASE_URL = 'https://kkanrbdewrozxpppphnr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OEFaldrTtKB0Z3nJSKNhSw_FvKmpjS0';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let goodsList = [];
  let isAdmin = false;
  let currentRecordId = null; 
  let globalDeadline = null;

  // 初始化页面
  window.onload = async function() {
    await fetchDeadline();
    await fetchGoods();
    await fetchGlobalStats();
  };

  // 获取报名截止时间
  async function fetchDeadline() {
    try {
      const { data, error } = await supabaseClient.from('system_config').select('*').eq('key', 'deadline').maybeSingle();
      if (data && data.value) {
        globalDeadline = new Date(data.value);
        document.getElementById('deadline-text').innerText = globalDeadline.toLocaleString();
        
        const localISO = new Date(globalDeadline.getTime() - (globalDeadline.getTimezoneOffset() * 60000)).toISOString().slice(0,16);
        document.getElementById('deadline-input').value = localISO;
      } else {
        document.getElementById('deadline-text').innerText = "未设置";
      }
      checkDeadlineExpired();
    } catch (e) {
      console.log("获取截止时间出错", e);
    }
  }

  // 检查是否已截止
  function checkDeadlineExpired() {
    if (!globalDeadline) return false;
    const isExpired = new Date() > globalDeadline;
    const statusEl = document.getElementById('deadline-status');
    const submitBtn = document.getElementById('submit-btn');

    if (isExpired) {
      statusEl.innerText = "(已截止)";
      statusEl.style.color = "red";
      submitBtn.disabled = true;
      submitBtn.innerText = "报名已截止（无法提交或修改）";
    } else {
      statusEl.innerText = "(进行中)";
      statusEl.style.color = "#07c160";
      submitBtn.disabled = false;
      submitBtn.innerText = currentRecordId ? "保存修改" : "确认提交并扣减库存";
    }
    return isExpired;
  }

  // 保存截止时间
  async function saveDeadline() {
    const val = document.getElementById('deadline-input').value;
    if (!val) return alert("请选择有效时间");
    
    const isoStr = new Date(val).toISOString();
    const { error } = await supabaseClient.from('system_config').upsert({ key: 'deadline', value: isoStr });
    if (error) {
      alert("保存失败");
    } else {
      alert("截止时间设置成功");
      await fetchDeadline();
    }
  }

  // 获取商品及库存
  async function fetchGoods() {
    const { data, error } = await supabaseClient.from('goods').select('*').order('id', { ascending: true });
    if (error) return console.error(error);
    
    goodsList = (data || []).map(item => {
      const old = goodsList.find(g => g.id === item.id);
      return { ...item, selectCount: old ? old.selectCount : 0 };
    });

    renderGoods();
    if (isAdmin) renderAdminGoods();
  }

  // 渲染商品列表
  function renderGoods() {
    const container = document.getElementById('goods-container');
    container.innerHTML = '';

    goodsList.forEach(g => {
      const itemEl = document.createElement('div');
      itemEl.className = 'goods-item';
      itemEl.innerHTML = `
        <div class="goods-info">
          <div class="goods-name">${g.name}</div>
          <div class="goods-stock">剩余库存: ${g.stock}</div>
        </div>
        <div class="counter">
          <button class="btn-counter" onclick="changeCount(${g.id}, -1)">-</button>
          <span class="count-num">${g.selectCount}</span>
          <button class="btn-counter" onclick="changeCount(${g.id}, 1)">+</button>
        </div>
      `;
      container.appendChild(itemEl);
    });
  }

  // 改变商品数量
  function changeCount(id, delta) {
    if (checkDeadlineExpired()) {
      return alert('报名已截止，无法选择');
    }
    const g = goodsList.find(x => x.id === id);
    if (!g) return;

    if (delta > 0 && g.selectCount >= g.stock) {
      return alert('所选数量超过剩余库存！');
    }
    if (delta < 0 && g.selectCount <= 0) return;

    g.selectCount += delta;
    renderGoods();
  }

  // 提交订单
  async function submitOrder() {
    try {
      const { data: configData } = await supabaseClient.from('system_config').select('*').eq('key', 'deadline').single();
      if (configData && configData.value) {
        const now = new Date();
        const deadline = new Date(configData.value);
        if (now > deadline) {
          alert('提交失败：报名已于 ' + deadline.toLocaleString() + ' 截止！');
          checkDeadlineExpired();
          return;
        }
      }
    } catch (e) {
      console.log("校验时间失败", e);
    }

    const name = document.getElementById('username').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const remark = document.getElementById('remark').value.trim();
    const useCoupon = document.getElementById('useCoupon').checked;
    
    const pickupEl = document.querySelector('input[name="pickupLocation"]:checked');
    const pickupLocation = pickupEl ? pickupEl.value : '培训中心';

    if (!phone || !name) return alert('请填写手机号和姓名');

    const selected = goodsList.filter(g => g.selectCount > 0);
    if (selected.length === 0) return alert('请至少选择一件物品');

    if (currentRecordId) {
      const { data: oldRecord } = await supabaseClient.from('records').select('*').eq('id', currentRecordId).maybeSingle();
      if (oldRecord && oldRecord.goods_summary) {
        const oldItems = oldRecord.goods_summary.split(';');
        for (let str of oldItems) {
          const parts = str.split('x');
          if (parts.length === 2) {
            const gName = parts[0].trim();
            const oldQty = parseInt(parts[1].trim());
            const g = goodsList.find(x => x.name.trim() === gName);
            if (g) {
              await supabaseClient.from('goods').update({ stock: g.stock + oldQty }).eq('id', g.id);
              g.stock += oldQty;
            }
          }
        }
      }
    }

    let goodsSummaryArr = [];
    for (let item of selected) {
      goodsSummaryArr.push(`${item.name} x${item.selectCount}`);
      const newStock = item.stock - item.selectCount;
      await supabaseClient.from('goods').update({ stock: newStock }).eq('id', item.id);
    }

    const orderData = {
      name,
      phone,
      remark,
      use_coupon: useCoupon,
      pickup_location: pickupLocation,
      goods_summary: goodsSummaryArr.join('; ')
    };

    if (currentRecordId) {
      await supabaseClient.from('records').update(orderData).eq('id', currentRecordId);
      alert('修改成功！');
    } else {
      await supabaseClient.from('records').insert([orderData]);
      alert('提交成功！');
    }

    document.getElementById('username').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('remark').value = '';
    document.getElementById('useCoupon').checked = false;
    goodsList.forEach(g => g.selectCount = 0);
    resetToNewMode();

    await fetchGoods();
    await fetchGlobalStats();
    handlePhoneBlur();
  }

  // 手机号失焦查记录
  async function handlePhoneBlur() {
    const phone = document.getElementById('phone').value.trim();
    if (!phone) return;

    if (isAdmin) {
      fetchRecords();
      return;
    }

    const { data, error } = await supabaseClient
      .from('records')
      .select('*')
      .eq('phone', phone)
      .order('created_at', { ascending: false });

    if (error) return console.error(error);
    renderRecords(data || []);

    if (data && data.length > 0 && !currentRecordId) {
      document.getElementById('username').value = data[0].name || '';
    }
  }

  // 渲染记录
  function renderRecords(records) {
    const container = document.getElementById('records-container');
    container.innerHTML = '';

    if (records.length === 0) {
      container.innerHTML = '<div style="color:#999; font-size:13px;">暂无提交记录</div>';
      return;
    }

    records.forEach(r => {
      const item = document.createElement('div');
      item.className = 'record-item';
      
      const isExpired = checkDeadlineExpired();
      const actionBtn = isAdmin 
        ? `<button class="btn-delete" onclick="deleteRecord(${r.id})">删除记录</button>`
        : (!isExpired ? `<button class="btn-delete" style="background:#1890ff;" onclick='editRecord(${JSON.stringify(r)})'>修改此单</button>` : '');

      item.innerHTML = `
        ${actionBtn}
        <div class="user-info">提交人：${r.name} (${r.phone})</div>
        <div>提货地址：<span style="color:#1890ff; font-weight:bold;">${r.pickup_location || '培训中心'}</span></div>
        <div>选择物品：${r.goods_summary}</div>
        <div>是否用券：${r.use_coupon ? '是' : '否'}</div>
        <div>备注：${r.remark || '无'}</div>
        <div style="font-size:11px; color:#bbb; margin-top:4px;">${new Date(r.created_at).toLocaleString()}</div>
      `;
      container.appendChild(item);
    });
  }

  // 编辑已有订单
  function editRecord(record) {
    currentRecordId = record.id;
    document.getElementById('username').value = record.name;
    document.getElementById('phone').value = record.phone;
    document.getElementById('remark').value = record.remark || '';
    document.getElementById('useCoupon').checked = record.use_coupon || false;

    const radios = document.getElementsByName('pickupLocation');
    for (let r of radios) {
      if (r.value === record.pickup_location) r.checked = true;
    }

    goodsList.forEach(g => g.selectCount = 0);
    if (record.goods_summary) {
      const items = record.goods_summary.split(';');
      items.forEach(str => {
        const parts = str.split('x');
        if (parts.length === 2) {
          const name = parts[0].trim();
          const qty = parseInt(parts[1].trim());
          const g = goodsList.find(x => x.name.trim() === name);
          if (g) g.selectCount = qty;
        }
      });
    }

    renderGoods();
    const btn = document.getElementById('submit-btn');
    btn.innerText = "保存修改";
    btn.style.backgroundColor = "#1890ff";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetToNewMode() {
    currentRecordId = null;
    const btn = document.getElementById('submit-btn');
    btn.innerText = "确认提交并扣减库存";
    btn.style.backgroundColor = "#07c160";
  }

  // 汇总看板
  async function fetchGlobalStats() {
    const { data: records } = await supabaseClient.from('records').select('*');
    const container = document.getElementById('stat-grid-box');
    container.innerHTML = '';

    if (!records) return;

    const totalUsers = records.length;
    const itemMap = {};
    goodsList.forEach(g => itemMap[g.name] = 0);

    records.forEach(r => {
      if (r.goods_summary) {
        r.goods_summary.split(';').forEach(part => {
          const p = part.split('x');
          if (p.length === 2) {
            const name = p[0].trim();
            const qty = parseInt(p[1].trim()) || 0;
            if (itemMap[name] !== undefined) itemMap[name] += qty;
            else itemMap[name] = qty;
          }
        });
      }
    });

    let html = `
      <div class="stat-card">
        <div style="font-size:12px; color:#666;">已报名总人数</div>
        <div class="stat-num">${totalUsers} 人</div>
      </div>
    `;

    for (let key in itemMap) {
      html += `
        <div class="stat-card">
          <div style="font-size:12px; color:#666;">${key} 领用</div>
          <div class="stat-num">${itemMap[key]} 份</div>
        </div>
      `;
    }
    container.innerHTML = html;
  }

  // --- 管理员逻辑 ---
  function toggleAdminMode() {
    if (!isAdmin) {
      const pwd = prompt("请输入管理员密码：");
      if (pwd === "123456") {
        isAdmin = true;
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('admin-toggle-btn').innerText = "当前模式：管理员(点击退出)";
        document.getElementById('records-title').innerText = "全部提交记录（管理员界面）";
        renderAdminGoods();
        fetchRecords();
      } else if (pwd !== null) {
        alert("密码错误！");
      }
    } else {
      isAdmin = false;
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('admin-toggle-btn').innerText = "管理员入口";
      document.getElementById('records-title').innerText = "我的提交记录";
      handlePhoneBlur();
    }
  }

  function renderAdminGoods() {
    const container = document.getElementById('admin-goods-list');
    container.innerHTML = '';
    goodsList.forEach(g => {
      const row = document.createElement('div');
      row.className = 'admin-row';
      row.style.marginBottom = '6px';
      row.innerHTML = `
        <input type="text" value="${g.name}" class="input-text" id="g-name-${g.id}">
        <input type="number" value="${g.stock}" class="input-text" style="width:100px;" id="g-stock-${g.id}">
        <button class="btn-admin btn-danger" onclick="deleteGoods(${g.id})">删除商品</button>
      `;
      container.appendChild(row);
    });
  }

  async function addGoods() {
    const name = document.getElementById('new-goods-name').value.trim();
    const stock = parseInt(document.getElementById('new-goods-stock').value);
    if (!name || isNaN(stock)) return alert('请填入完整的商品名称和库存');

    await supabaseClient.from('goods').insert([{ name, stock }]);
    document.getElementById('new-goods-name').value = '';
    document.getElementById('new-goods-stock').value = '';
    await fetchGoods();
    await fetchGlobalStats();
  }

  async function deleteGoods(id) {
    if (!confirm('确定删除该商品吗？')) return;
    await supabaseClient.from('goods').delete().eq('id', id);
    await fetchGoods();
    await fetchGlobalStats();
  }

  async function fetchRecords() {
    const { data } = await supabaseClient.from('records').select('*').order('created_at', { ascending: false });
    renderRecords(data || []);
  }

  async function deleteRecord(id) {
    if (!confirm('确定彻底删除该条记录吗？')) return;
    await supabaseClient.from('records').delete().eq('id', id);
    fetchRecords();
    await fetchGlobalStats();
  }

  // 新增：一键清空所有申报记录（包含二次确认机制）
  async function clearAllRecords() {
    const input = prompt("警告：此操作将永久清空所有人的申报记录！\n若确定要清空，请在下方输入大写字母 CLEAR：");
    if (input === 'CLEAR') {
      try {
        // 删除 id 大于 0 的所有数据
        const { error } = await supabaseClient.from('records').delete().gt('id', 0);
        if (error) {
          alert('清空失败：' + error.message);
        } else {
          alert('所有申报记录已成功清空！');
          await fetchRecords();
          await fetchGlobalStats();
        }
      } catch (err) {
        alert('操作失败：' + err.message);
      }
    } else if (input !== null) {
      alert('输入验证不正确，已取消清空操作。');
    }
  }

  // 稳定防报错导出 Excel / CSV
  async function exportToExcel() {
    try {
      const { data: records, error: recErr } = await supabaseClient
        .from('records')
        .select('*')
        .order('created_at', { ascending: false });

      if (recErr) return alert('获取数据失败：' + recErr.message);
      if (!records || records.length === 0) return alert('暂无数据可导出！');

      let dynamicGoodsSet = new Set();
      const { data: goods } = await supabaseClient.from('goods').select('name');
      if (goods && goods.length > 0) {
        goods.forEach(g => { if (g.name) dynamicGoodsSet.add(g.name.trim()); });
      }

      records.forEach(r => {
        if (r.goods_summary) {
          r.goods_summary.split(';').forEach(part => {
            const item = part.trim().split('x');
            if (item.length === 2 && item[0].trim()) {
              dynamicGoodsSet.add(item[0].trim());
            }
          });
        }
      });

      const goodsNames = Array.from(dynamicGoodsSet);

      let headers = ['提交时间', '姓名', '联系电话', '提货地址'];
      headers = headers.concat(goodsNames);
      headers.push('是否用券', '备注信息');

      const rows = records.map(r => {
        const itemMap = {};
        if (r.goods_summary) {
          const parts = r.goods_summary.split(';');
          parts.forEach(part => {
            const item = part.trim().split('x');
            if (item.length === 2) {
              const name = item[0].trim();
              const qty = parseInt(item[1].trim()) || 0;
              itemMap[name] = qty;
            }
          });
        }

        const cleanName = `"${(r.name || '').replace(/"/g, '""')}"`;
        const cleanPhone = `"${(r.phone || '').replace(/"/g, '""')}"`;
        const cleanLocation = `"${(r.pickup_location || '培训中心').replace(/"/g, '""')}"`;
        const cleanRemark = `"${(r.remark || '').replace(/"/g, '""')}"`;
        const timeStr = r.created_at ? new Date(r.created_at).toLocaleString() : '';

        const row = [timeStr, cleanName, cleanPhone, cleanLocation];

        goodsNames.forEach(gName => {
          row.push(itemMap[gName] !== undefined ? itemMap[gName] : 0);
        });

        row.push(r.use_coupon ? '是' : '否', cleanRemark);

        return row.join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      const dateStr = new Date().toISOString().slice(0, 10);
      
      link.href = url;
      link.download = `内部物品领用明细表_${dateStr}.csv`;
      document.body.appendChild(link);
      link.click();
      
      setTimeout(() => {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 100);

    } catch (err) {
      console.error('导出崩溃异常:', err);
      alert('导出发生错误！');
    }
  }
</script>
